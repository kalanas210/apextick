<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Order cancelled</title></head>
<body style="font-family: Arial, Helvetica, sans-serif; color: #1a1a1a;">
<h2>Your order was cancelled</h2>
<p>Order <strong th:text="${cancel.orderNumber}">APX-XXXX</strong> has been cancelled
   (<span th:text="${cancel.reason}">reason</span>).</p>
<p>If a payment was taken, a refund has been requested. No seats are held for this order.</p>
</body>
</html>
