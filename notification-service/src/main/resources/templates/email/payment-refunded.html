<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Your refund</title></head>
<body style="font-family: Arial, Helvetica, sans-serif; color: #1a1a1a;">
<h2>Your refund is on its way</h2>
<p>We have refunded <strong th:text="${amount}">USD 0.00</strong>
   for order <strong th:text="${refund.orderNumber}">APX-XXXX</strong>
   (<span th:text="${refund.eventName}">Event</span>).</p>
<p th:text="${why}">Why the money went back.</p>
<p>It goes back to the card you paid with. Banks usually show it within 5 to 10 working days.</p>
<p>See the order at <a th:href="${orderUrl}" th:text="${orderUrl}">order</a>.</p>
</body>
</html>
