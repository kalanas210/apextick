# ApexTick login theme.
#
# Extends Keycloak's own v2 login theme rather than replacing it, so every
# screen the identity provider owns — password reset, OTP, consent, account
# linking, error pages, translations — keeps working and simply arrives in
# ApexTick's colours. Nothing here overrides a FreeMarker template.
parent=keycloak.v2
import=common/keycloak

# Loaded after the parent's stylesheets, so these rules win.
styles=css/styles.css css/apextick.css
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css

# The brand is dark by design; don't follow the operating system.
darkMode=false

# Shown in the card header when there is no logo image.
kcHtmlClass=login-pf apextick
