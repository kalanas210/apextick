services:
  postgres:
    image: postgres:18
    container_name: apextick-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: apextick_notifications
    ports:
      - "5440:5432"
    volumes:
      - apextick_pgdata:/var/lib/postgresql
      - ./infra/postgres/init-multi-db.sh:/docker-entrypoint-initdb.d/10-init-multi-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: apextick-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # SMTP for verification / password-reset mail. Defaults hit the bundled
      # Mailpit; set SMTP_* in .env to send through a real provider.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@apextick.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ApexTick}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Client secrets the realm import fills in (keycloak/README.md). The
      # defaults equal .env.example's; scripts/wso2 reads a secret an older
      # .env lacks from this container's environment, so they still agree.
      WSO2_KM_CLIENT_SECRET: ${WSO2_KM_CLIENT_SECRET:-dev-wso2-km-secret}
      LOADTEST_CLIENT_SECRET: ${LOADTEST_CLIENT_SECRET:-dev-loadtest-secret}
      APP_WEB_URL: ${APP_WEB_URL:-http://localhost:3000}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-kalana@apextick.local}
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
      # branded login screens; Keycloak reads themes from this directory
      - ./keycloak/themes:/opt/keycloak/themes:ro

  rabbitmq:
    image: rabbitmq:4-management
    container_name: apextick-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: apextick-redis
    command: redis-server --notify-keyspace-events Ex
    ports:
      - "6379:6379"

  booking-service:
    build: ./booking-service
    container_name: apextick-booking
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/apextick/protocol/openid-connect/certs
      # Signature verification always goes to the fixed internal URL above, but
      # Spring Security separately checks the token's `iss` claim as a literal
      # string against this. It has to match whatever host the browser used to
      # reach Keycloak (see frontend/app/providers.tsx) -- localhost by
      # default; override to exercise the app through the WSO2 gateway
      # locally, since that container can't resolve "localhost" as the host
      # machine (see docs/wso2.md).
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://localhost:8180/realms/apextick}
      APP_PAYMENT_PROVIDER: ${APP_PAYMENT_PROVIDER:-mock}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUPPORTED_CURRENCIES: ${STRIPE_SUPPORTED_CURRENCIES:-}
      S3_ENABLED: ${S3_ENABLED:-true}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-apextick-tickets}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "8081:8081"
    restart: unless-stopped
  
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: apextick-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - apextick_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: apextick-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    container_name: apextick-notification
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/apextick_notifications
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # Same SMTP_* as Keycloak: the bundled Mailpit unless .env names a real
      # provider, which then needs the login and STARTTLS too.
      SPRING_MAIL_HOST: ${SMTP_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SMTP_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SMTP_USER:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SMTP_AUTH:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: ${SMTP_SSL:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:-10000}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:-10000}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:-10000}
      # Gmail rewrites a From that isn't the authenticated account, so fall
      # back to SMTP_FROM before the placeholder address.
      MAIL_FROM: ${MAIL_FROM:-${SMTP_FROM:-no-reply@apextick.local}}
      APP_WEB_URL: ${APP_WEB_URL:-http://localhost:3000}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: apextick-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped

  # --- API gateway (opt-in): docker compose --profile wso2 up ---
  # Needs ~4 GB of free memory. Portals live on 9443 and are never published in
  # production; the gateway itself answers on 8280 (http) / 8243 (https).
  # Configure it after startup with scripts/wso2/setup.sh.
  wso2am:
    image: wso2/wso2am:4.5.0
    container_name: apextick-wso2am
    profiles: ["wso2"]
    depends_on:
      keycloak:
        condition: service_started
    environment:
      WSO2_ADMIN_PASSWORD: ${WSO2_ADMIN_PASSWORD:-admin}
      JVM_MEM_OPTS: ${WSO2_JVM_MEM_OPTS:--Xms1g -Xmx2g}
    mem_limit: ${WSO2_MEM_LIMIT:-4g}
    ports:
      - "9443:9443"   # publisher / devportal / admin (keep private in prod)
      - "8280:8280"   # gateway, http
      - "8243:8243"   # gateway, https
    # The Keycloak self-validation connector dials the token's own `iss` URL
    # directly rather than only the pre-registered JWKS endpoint. A browser on
    # the host gets tokens issued against whatever hostname it used to reach
    # Keycloak (see frontend/app/providers.tsx) -- for local dev that's
    # published-port host access, which "localhost" can't mean from inside
    # this container. host.docker.internal is the one hostname both the host
    # browser and this container can resolve to the same machine; see
    # docs/wso2.md for how to exercise the gateway locally because of this.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./wso2/conf/deployment.toml:/home/wso2carbon/wso2am-4.5.0/repository/conf/deployment.toml:ro
      - apextick_wso2:/home/wso2carbon/wso2am-4.5.0/repository/database
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:9443/services/Version >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 240s
    restart: unless-stopped

  # --- Observability (opt-in): docker compose --profile observability up ---
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: apextick-prometheus
    profiles: ["observability"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - apextick_prometheus:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: apextick-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - apextick_grafana:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  apextick_pgdata:
  apextick_minio:
  apextick_wso2:
  apextick_prometheus:
  apextick_grafana: