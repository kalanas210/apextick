# Test profile: infrastructure comes from Testcontainers (@ServiceConnection),
# so only behavioural overrides live here.
spring:
  jpa:
    show-sql: false
  liquibase:
    contexts: demo

app:
  hold:
    duration: PT5M
    max-seats: 8
    # Wider than production's PT2S on purpose: every test class shares one database and the
    # scheduled fallback sweeper keeps ticking through all of them, so a short tolerance lets
    # it free a seat a test meant the Redis expiry listener to free. One minute keeps the
    # sweeper off deadlines that have only just passed; HoldSweeperTest drives it directly with
    # an hour-old hold, so the fallback path is still covered.
    expiry-tolerance: PT1M
    sweeper-interval: PT30S
    sweeper-batch: 500
  outbox:
    poll-interval: PT0.2S
    batch-size: 100
    max-attempts: 5
    confirm-timeout: PT5S
  order:
    fee-percent: 5
    payment-window: PT10M
    sweeper-interval: PT30S
  payment:
    provider: mock
  rate-limit:
    enabled: false
    hold:
      limit: 30
      window: PT1M
    order:
      limit: 10
      window: PT1M
