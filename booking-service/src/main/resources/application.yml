spring:
  application:
    name: booking-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/apextick}
          # In containerised deployments where the public issuer differs from the
          # internal JWKS location, set SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5440/apextick}
    username: ${POSTGRES_USER:apextick}
    password: ${POSTGRES_PASSWORD:apextick}
    hikari:
      pool-name: booking-hikari
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1500000
      leak-detection-threshold: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${LIQUIBASE_CONTEXTS:demo}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:apextick}
    password: ${RABBITMQ_PASSWORD:apextick}
    publisher-confirm-type: correlated
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8081

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  public-url: ${APP_PUBLIC_URL:http://localhost:8081}
  web-url: ${APP_WEB_URL:http://localhost:3000}
