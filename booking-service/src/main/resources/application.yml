spring:
  application:
    name: booking-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/apextick}
          # In containerised deployments where the public issuer differs from the
          # internal JWKS location, set SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5440/apextick}
    username: ${POSTGRES_USER:apextick}
    password: ${POSTGRES_PASSWORD:apextick}
    hikari:
      pool-name: booking-hikari
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1500000
      leak-detection-threshold: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${LIQUIBASE_CONTEXTS:demo}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:apextick}
    password: ${RABBITMQ_PASSWORD:apextick}
    publisher-confirm-type: correlated
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8081

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  public-url: ${APP_PUBLIC_URL:http://localhost:8081}
  web-url: ${APP_WEB_URL:http://localhost:3000}
  hold:
    duration: ${APP_HOLD_DURATION:PT5M}
    max-seats: ${APP_HOLD_MAX_SEATS:8}
    expiry-tolerance: ${APP_HOLD_EXPIRY_TOLERANCE:PT2S}
    sweeper-interval: ${APP_HOLD_SWEEPER_INTERVAL:PT30S}
    sweeper-batch: ${APP_HOLD_SWEEPER_BATCH:500}
  outbox:
    poll-interval: ${APP_OUTBOX_POLL_INTERVAL:PT1S}
    batch-size: ${APP_OUTBOX_BATCH_SIZE:100}
    max-attempts: ${APP_OUTBOX_MAX_ATTEMPTS:10}
    confirm-timeout: ${APP_OUTBOX_CONFIRM_TIMEOUT:PT5S}
  order:
    fee-percent: ${APP_ORDER_FEE_PERCENT:5}
    payment-window: ${APP_ORDER_PAYMENT_WINDOW:PT10M}
    sweeper-interval: ${APP_ORDER_SWEEPER_INTERVAL:PT30S}
  payment:
    provider: ${APP_PAYMENT_PROVIDER:mock}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      # Comma-separated allow-list (e.g. usd,gbp,inr); empty accepts every currency.
      supported-currencies: ${STRIPE_SUPPORTED_CURRENCIES:}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    hold:
      limit: ${APP_RATE_LIMIT_HOLD_LIMIT:30}
      window: ${APP_RATE_LIMIT_HOLD_WINDOW:PT1M}
    order:
      limit: ${APP_RATE_LIMIT_ORDER_LIMIT:10}
      window: ${APP_RATE_LIMIT_ORDER_WINDOW:PT1M}
