services:
  postgres:
    image: postgres:18
    container_name: apextick-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - apextick_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: apextick-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Behind the Caddy reverse proxy: trust X-Forwarded-* and advertise the
      # public HTTPS URL so issuer / auth / redirect URLs are correct.
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://${SERVER_IP}.nip.io
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: apextick-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: apextick-redis
    command: redis-server --notify-keyspace-events Ex
    restart: unless-stopped

  booking-service:
    image: kalanas5/apextick-booking:latest
    container_name: apextick-booking
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      # Keys are fetched server-side over the internal docker network, but the
      # issuer claim in tokens is the public HTTPS URL (what the browser used),
      # so issuer-uri must match that exactly.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/apextick/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://${SERVER_IP}.nip.io/realms/apextick
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://${SERVER_IP}:3000,https://${SERVER_IP}.nip.io
    ports:
      - "8081:8081"
    restart: unless-stopped

  notification-service:
    image: kalanas5/apextick-notification:latest
    container_name: apextick-notification
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    restart: unless-stopped

  frontend:
    image: kalanas5/apextick-frontend:latest
    container_name: apextick-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped

  # TLS-terminating reverse proxy. Serves one HTTPS origin
  # (https://<SERVER_IP>.nip.io) and routes by path:
  #   /realms,/resources,/admin,/js -> keycloak   /api -> booking   else -> frontend
  # Caddy auto-provisions a browser-trusted cert via ACME (ports 80/443).
  caddy:
    image: caddy:2-alpine
    container_name: apextick-caddy
    depends_on:
      - frontend
      - keycloak
      - booking-service
    environment:
      SERVER_IP: ${SERVER_IP}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  apextick_pgdata:
  caddy_data:
  caddy_config: