# Production stack for the EC2 deployment. Only Caddy is published to the
# internet (80/443); everything else talks over the internal docker network, so
# 3000 / 8081 / 8180 stay closed at the security group. Admin surfaces (the
# Keycloak console, WSO2 portals, Grafana, Prometheus) bind to loopback only.
#
# Credentials have no fallback values here: compose refuses to start until
# each one is set in .env, rather than quietly running with a well-known
# default (see .env.example for the list). Nor do the settings that decide
# what this deployment is: its address, payment provider, seed data and code.
#
# Images are pulled, not built. CI publishes every commit on main and develop to
# GHCR as sha-<commit>, and .env must name the exact tags to run (BOOKING_IMAGE,
# NOTIFICATION_IMAGE, FRONTEND_IMAGE): a deploy is always a known commit, and the
# rollback is the tag before it. Third-party images are pinned to exact releases,
# except postgres, which is pinned to its major version (see that service).
services:
  postgres:
    # A data directory belongs to a major version, so the major version is what is
    # pinned. Minor releases are drop-in fixes, and an exact tag here would one day
    # mean starting a server older than the one that last wrote the data.
    image: postgres:18
    container_name: apextick-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # notification-service and Keycloak each own a database (database-per-service).
      # This runs only on an empty data directory; db-init covers a server with data.
      POSTGRES_MULTIPLE_DATABASES: apextick_notifications,keycloak
    volumes:
      # postgres:18 keeps PGDATA at /var/lib/postgresql/18/docker, so the volume
      # has to cover /var/lib/postgresql — mounting .../data persists nothing.
      - apextick_pgdata:/var/lib/postgresql
      - ./infra/postgres/init-multi-db.sh:/docker-entrypoint-initdb.d/10-init-multi-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Creates each database a service needs when it is missing, then exits. The
  # postgres image runs its init scripts only on an empty data directory, so a
  # server that already has data -- this one, the day Keycloak moved onto Postgres
  # -- would otherwise never get the keycloak database.
  db-init:
    image: postgres:18
    container_name: apextick-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_MULTIPLE_DATABASES: apextick_notifications,keycloak
    volumes:
      - ./infra/postgres/init-multi-db.sh:/init-multi-db.sh:ro
    entrypoint: ["bash", "/init-multi-db.sh"]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: apextick-keycloak
    # Production mode, with its accounts in Postgres. start-dev kept its database
    # inside the container, so every recreate -- which any change to this service's
    # environment is -- dropped each account registered since. The first start
    # builds for Postgres, which takes a minute; --import-realm only imports the
    # realm when the database does not have it yet.
    command: start --import-realm
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # One node, nothing to cluster with. TLS ends at Caddy, which reaches Keycloak
      # over plain HTTP on the docker network; health is served on port 9000.
      KC_CACHE: local
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN must be set}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      # SMTP for verification / password-reset mail. Defaults hit the bundled
      # Mailpit; set SMTP_* in .env to send through a real provider.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@apextick.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ApexTick}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Client secrets and the site origin the realm import fills in
      # (keycloak/README.md). An unset placeholder would import as its own,
      # publicly known text, so there is no fallback here.
      WSO2_KM_CLIENT_SECRET: ${WSO2_KM_CLIENT_SECRET:?WSO2_KM_CLIENT_SECRET must be set}
      LOADTEST_CLIENT_SECRET: ${LOADTEST_CLIENT_SECRET:?LOADTEST_CLIENT_SECRET must be set}
      APP_WEB_URL: https://${SERVER_IP:?SERVER_IP must be set}.nip.io
      # The realm's local-development redirect URIs, pointed at the site itself
      # here, so production allows no localhost redirect (keycloak/README.md).
      DEV_PREVIEW_WEB_URL: https://${SERVER_IP:?SERVER_IP must be set}.nip.io
      DEV_DOCKER_WEB_URL: https://${SERVER_IP:?SERVER_IP must be set}.nip.io
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-kalana@apextick.local}
      # Behind the Caddy reverse proxy: trust X-Forwarded-* and advertise the
      # public HTTPS URL so issuer / auth / redirect URLs are correct.
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://${SERVER_IP:?SERVER_IP must be set}.nip.io
      # The admin console is not published through Caddy. It is served on the
      # loopback-only port below and reached over an SSH tunnel, like the WSO2
      # portals:  ssh -L 8180:localhost:8180 ubuntu@<host>
      # (stop the local dev stack first: it also listens on 8180, and ssh only
      # warns when it can't bind), then open http://localhost:8180/admin/.
      # Its login runs in the master realm, whose pages would otherwise post
      # back to the public hostname (where Caddy closes that realm), so point
      # the master realm at the tunnel as well. The setting lives in Keycloak's
      # database, so this is needed once per database, not after every recreate:
      #   docker exec -it apextick-keycloak /opt/keycloak/bin/kcadm.sh config credentials --config /tmp/kcadm.config --server http://localhost:8080 --realm master --user <KEYCLOAK_ADMIN>
      #   docker exec apextick-keycloak /opt/keycloak/bin/kcadm.sh update realms/master --config /tmp/kcadm.config -s attributes.frontendUrl=http://localhost:8180
      KC_HOSTNAME_ADMIN: http://localhost:8180
    healthcheck:
      # No curl in the image, so bash asks the management port. Ready means a 200: a
      # Keycloak still starting answers 503, with a body whose checks can read UP.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '^HTTP/1.1 200' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
      # branded login screens; Keycloak reads themes from this directory
      - ./keycloak/themes:/opt/keycloak/themes:ro
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.5-management
    container_name: apextick-rabbitmq
    # The node's name, and with it the directory its data lives in, comes from the
    # hostname. Docker gives every new container a random one, which would leave
    # the volume below holding a node that nothing starts as.
    hostname: apextick-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
    volumes:
      # Queues, bindings, and whatever is parked in the dead-letter queues. Without
      # it, a routine pull and up -d started an empty broker.
      - apextick_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine
    container_name: apextick-redis
    command: redis-server --notify-keyspace-events Ex
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: apextick-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
    volumes:
      - apextick_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: apextick-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    restart: unless-stopped

  booking-service:
    image: ${BOOKING_IMAGE:?BOOKING_IMAGE must be set to ghcr.io/kalanas210/apextick-booking:sha-<commit>}
    container_name: apextick-booking
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      # Keys are fetched server-side over the internal docker network, but the
      # issuer claim in tokens is the public HTTPS URL (what the browser used),
      # so issuer-uri must match that exactly.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/apextick/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://${SERVER_IP:?SERVER_IP must be set}.nip.io/realms/apextick
      APP_CORS_ALLOWED_ORIGINS: https://${SERVER_IP:?SERVER_IP must be set}.nip.io
      APP_PUBLIC_URL: https://${SERVER_IP:?SERVER_IP must be set}.nip.io
      APP_WEB_URL: https://${SERVER_IP:?SERVER_IP must be set}.nip.io
      # What the database is seeded with, and so what the storefront says it is:
      # demo (the sample season, its shared account, "demonstration site" labels) or
      # prod (no seed data). No default, so leaving it out cannot make a demo.
      LIQUIBASE_CONTEXTS: ${LIQUIBASE_CONTEXTS:?LIQUIBASE_CONTEXTS must be set to demo or prod}
      # Abuse controls, declared with their application.yml defaults so the demo host
      # is tunable from .env without editing this file. Unset, they behave exactly as
      # before; compose forwards nothing a service has not declared.
      APP_RATE_LIMIT_ENABLED: ${APP_RATE_LIMIT_ENABLED:-true}
      APP_RATE_LIMIT_HOLD_LIMIT: ${APP_RATE_LIMIT_HOLD_LIMIT:-30}
      APP_RATE_LIMIT_HOLD_WINDOW: ${APP_RATE_LIMIT_HOLD_WINDOW:-PT1M}
      APP_HOLD_MAX_SEATS: ${APP_HOLD_MAX_SEATS:-8}
      # mock takes no money at all; stripe takes test or live payments, as its keys
      # decide. No default: a deployment meant to take payments must not quietly
      # fall back to one that hands out free tickets.
      APP_PAYMENT_PROVIDER: ${APP_PAYMENT_PROVIDER:?APP_PAYMENT_PROVIDER must be set to mock or stripe}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUPPORTED_CURRENCIES: ${STRIPE_SUPPORTED_CURRENCIES:-}
      S3_ENABLED: ${S3_ENABLED:-true}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-apextick-tickets}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
    restart: unless-stopped

  notification-service:
    image: ${NOTIFICATION_IMAGE:?NOTIFICATION_IMAGE must be set to ghcr.io/kalanas210/apextick-notification:sha-<commit>}
    container_name: apextick-notification
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/apextick_notifications
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      # Same SMTP_* as Keycloak; a real provider needs the login and STARTTLS.
      SPRING_MAIL_HOST: ${SMTP_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SMTP_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SMTP_USER:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SMTP_AUTH:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: ${SMTP_SSL:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:-10000}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:-10000}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:-10000}
      # Gmail rewrites a From that isn't the authenticated account, so fall
      # back to SMTP_FROM before the placeholder address.
      MAIL_FROM: ${MAIL_FROM:-${SMTP_FROM:-no-reply@apextick.local}}
      APP_WEB_URL: https://${SERVER_IP:?SERVER_IP must be set}.nip.io
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be set to ghcr.io/kalanas210/apextick-frontend:sha-<commit>}
    container_name: apextick-frontend
    environment:
      # Server-rendered storefront pages read the catalog from inside the
      # network; only the browser goes back out through Caddy.
      API_INTERNAL_URL: http://booking-service:8081
    restart: unless-stopped

  # API gateway. Sits between Caddy and booking-service: rejects bad/missing
  # tokens and unsubscribed callers at the edge, and sheds seat-hold bursts
  # via the ApexTickHoldBurst policy, before booking-service ever sees them.
  # See docs/wso2.md for the setup this depends on and its known limitations.
  wso2am:
    image: wso2/wso2am:4.5.0
    container_name: apextick-wso2am
    depends_on:
      keycloak:
        condition: service_started
    environment:
      WSO2_ADMIN_PASSWORD: ${WSO2_ADMIN_PASSWORD:?WSO2_ADMIN_PASSWORD must be set}
      JVM_MEM_OPTS: ${WSO2_JVM_MEM_OPTS:--Xms1g -Xmx2g}
    mem_limit: ${WSO2_MEM_LIMIT:-3g}
    ports:
      # Publisher / DevPortal / Admin -- loopback only, reach over an SSH
      # tunnel like the observability profile below, never the public IP.
      - "127.0.0.1:9443:9443"
    volumes:
      - ./wso2/conf/deployment.toml:/home/wso2carbon/wso2am-4.5.0/repository/conf/deployment.toml:ro
      - apextick_wso2:/home/wso2carbon/wso2am-4.5.0/repository/database
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:9443/services/Version >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 240s
    restart: unless-stopped

  # TLS-terminating reverse proxy. Serves one HTTPS origin
  # (https://<SERVER_IP>.nip.io) and routes by path:
  #   /realms,/resources,/js -> keycloak   /api -> wso2am   else -> frontend
  # (including /admin, the app's admin panel -- Keycloak's console is not public)
  # Caddy auto-provisions a browser-trusted cert via ACME (ports 80/443).
  caddy:
    image: caddy:2.11.4-alpine
    container_name: apextick-caddy
    depends_on:
      - frontend
      - keycloak
      - booking-service
      - wso2am
    environment:
      SERVER_IP: ${SERVER_IP:?SERVER_IP must be set}
      # set back to booking-service:8081 to bypass the gateway
      API_UPSTREAM: ${API_UPSTREAM:-wso2am:8280}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The directory, not the file: git replaces the Caddyfile on checkout, and
      # a single-file bind mount would keep showing the container the old one,
      # so even `caddy reload` would reload stale routes.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # Nightly logical dumps of every database, kept in ./backups for BACKUP_KEEP_DAYS.
  # They sit on the same disk as the data, so they cover a bad migration or a
  # mistaken delete, not the loss of the server: copy them off it for that.
  # scripts/backup/restore.sh puts one back (docs/runbook.md).
  backup:
    image: postgres:18
    container_name: apextick-backup
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      BACKUP_DATABASES: ${POSTGRES_DB:?POSTGRES_DB must be set},apextick_notifications,keycloak
      BACKUP_AT: ${BACKUP_AT:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./scripts/backup:/scripts:ro
      - ./backups:/backups
    entrypoint: ["bash", "/scripts/backup.sh", "schedule"]
    restart: unless-stopped

  # Observability, opt-in:
  #   docker compose -f docker-compose.prod.yml --profile observability up -d
  # Bound to loopback only — reach them over an SSH tunnel rather than the
  # public interface, e.g.
  #   ssh -L 3001:localhost:3001 -L 9090:localhost:9090 ubuntu@<host>
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: apextick-prometheus
    profiles: ["observability"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - apextick_prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: apextick-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - apextick_grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  apextick_pgdata:
  apextick_rabbitmq:
  apextick_minio:
  apextick_wso2:
  apextick_prometheus:
  apextick_grafana:
  caddy_data:
  caddy_config:
